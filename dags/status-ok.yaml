# n8n `gnzjOf2qHJoEPeGo` "Status OK"  ->  DAG `status-ok`
#
# Identyfikator wg decyzji par. 4.2: ^[a-z0-9][a-z0-9-]{0,38}$. Nazwa polska jest
# nazwa wyswietlana i siedzi w `description`, nie w identyfikatorze.
#
# Wyzwalacz `manualTrigger` przestaje byc wezlem: DAG bez `schedule:` jest uruchamiany
# na zadanie. Proces traci przez to jeden widoczny element grafu (2 wezly n8n -> 1 krok).
#
# Fixture: fixtures/status-ok/oczekiwane-wyjscie.json
name: status-ok
description: "Status OK — ustawia jedno pole status = \"OK\". Fixture scenariusza regresji R02/R03."
group: migracja-n8n
labels: [migracja-n8n, faza-1]

env:
  SKRYPTY: /var/lib/dagu/dags/skrypty

steps:
  - id: ustaw_status
    name: "Set Status"
    description: "n8n: wezel `Set Status` (set, 1 przypisanie status=\"OK\", typ string)"
    run: "$SKRYPTY/status-ok-ustaw.sh"
    output: WYNIK
    output_schema:
      type: object
      additionalProperties: false
      required: [elementy]
      properties:
        elementy:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [status]
            properties:
              status: {type: string}
