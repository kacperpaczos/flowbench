server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Statyczny build Vite. Aplikacja jest SPA, wiec kazda sciezka wraca do index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
