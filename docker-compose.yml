# Prototyp: React + silnik procesow w ramce, wszystko na jednym originie
# http://127.0.0.1:8080 (proxy Caddy).
#
# Faza 1 (docs/decyzja-architektoniczna.md v3.1): silnikiem jest Dagu. Usluga n8n
# zostaje ZA PROFILEM Compose jako droga wycofania - domyslnie nie wstaje, a jej
# wolumen `n8n_data` (pelna nazwa n8niframe_n8n_data) pozostaje nietkniety.
# Procedura wycofania: docs/wycofanie.md.

# --- SIECI (decyzja par. 5.2, utwardzenie po werdykcie R-C) --------------------
#
# R-C zostalo przyjete swiadomie: krok DAG-a biegnie jako root w kontenerze silnika
# i czyta jego plik konfiguracyjny (audyt P1). Czego jednak NIE musi miec, to drogi
# na zewnatrz i ruchu bocznego - audyt P2 zmierzyl, ze dzis krok dosiega
# `example.com` (gotowa eksfiltracja) i kazda usluge w sieci compose po nazwie DNS.
# Dlatego trzy sieci:
#
#   wewnetrzna  internal: true  - bez bramy na swiat. Tu siedzi silnik.
#   wycofanie   internal: true  - tylko stary n8n i proxy (patrz nizej).
#   wyjsciowa                   - chat-backend (wola API modelu) i proxy (publikacja portu).
#
# Czego to NIE domyka, zapisane wprost: krok DAG-a dzieli `wewnetrzna` z `proxy`,
# `frontend` i `chat-backend`, wiec dosiega ich po nazwie. Sieci Dockera sa
# dwukierunkowe, a proxy MUSI dosiegac silnika - wiec i silnik dosiega proxy.
# Przez proxy krok widzi to, co Caddy wystawia: /api/* (za brama sesji, 401),
# aplikacje React i sam UI Dagu. Pomiary w raporcie T1.
networks:
  wewnetrzna:
    internal: true
  # Stary silnik dostaje WLASNA siec, dzielona wylacznie z proxy. Decyzja par. 5.2
  # pokazuje n8n w `wewnetrzna`, ale wtedy krok DAG-a dosiegal by `n8n` po nazwie DNS -
  # a wymaganie odbiorcze mowi wprost, ze nie ma dosiegac. Nic na tym nie traci:
  # jedynym klientem n8n jest proxy (trasa /n8n/*), a chat-backend w trybie wycofania
  # wola n8n TEZ przez proxy.
  wycofanie:
    internal: true
  wyjsciowa: {}

# --- KONFIGURACJE (sekrety plikiem, nie przez `environment:`) ------------------
#
# Audyt P1 rozstrzygnal, ze przeniesienie sekretow Dagu z `environment:` do pliku
# konfiguracyjnego NIE JEST IZOLACJA: krok DAG-a biegnie jako root i ten plik czyta.
# Robimy to dla dwoch wezszych, prawdziwych korzysci i tylko tyle twierdzimy:
#   1. sekret nie siedzi w `docker inspect` uslugi,
#   2. sekret nie jest w srodowisku KAZDEGO procesu potomnego silnika.
# Wartosci pochodza z `.env` (wykluczony przez .gitignore), wzor w `.env.example`.
configs:
  dagu_config:
    content: |
      # Generowane przez Compose z .env - nie edytowac w kontenerze.
      #
      # Plik bazowy przeniesiony z domyslnego /var/lib/dagu/base.yaml na osobny
      # wolumen. Powod: warstwa polityki (chat-backend/KONTRAKT.md par. 4.7) musi go
      # CZYTAC, zeby zamknac droge obejscia przez akcje wlasne - a gdyby czytala go
      # przez wolumen silnika, dostalaby przy okazji config.yaml z sekretem
      # podpisujacym JWT. Osobny wolumen daje jej dokladnie jeden plik.
      base_config: /var/lib/dagu/bazowy/base.yaml
      auth:
        mode: builtin
        builtin:
          token:
            secret: ${DAGU_AUTH_TOKEN_SECRET:?ustaw DAGU_AUTH_TOKEN_SECRET w .env}
            ttl: 24h

  # Plik bazowy silnika musi ISTNIEC, zanim warstwa polityki sprobuje go przeczytac -
  # Dagu sam go nie tworzy, a `readFile` na braku pliku rzuca. Zasiewamy go przez
  # /etc/custom-init.d, czyli wlasny punkt rozszerzenia obrazu: /entrypoint.sh uruchamia
  # stamtad kazdy wykonywalny skrypt ZANIM zejdzie do uzytkownika docelowego.
  # Skrypt jest idempotentny - istniejacego pliku nie nadpisuje.
  dagu_zasiew_bazowego:
    content: |
      #!/bin/sh
      # $$ to ucieczka przed interpolacja Compose - w kontenerze zostaje pojedyncze $.
      B=/var/lib/dagu/bazowy/base.yaml
      mkdir -p "$$(dirname "$$B")"
      if [ ! -f "$$B" ]; then
        printf '%s\n' \
          '# Plik bazowy Dagu. Wspolne ustawienia i akcje wlasne dla wszystkich DAG-ow.' \
          '# Akcji z tego pliku NIE da sie przeslonic lokalnie (audyt walidacji par. 3.5),' \
          '# dlatego warstwa polityki go czyta - montowany read-only jako /silnik/base.yaml.' \
          '# Edycja: REST-em z rola admina. Pusty plik jest poprawny.' > "$$B"
      fi
      chmod 644 "$$B"

  # Prawdziwy token Dagu dla wariantu B2 (decyzja par. 5.2 R-B). Trzymany tak samo
  # jak sekrety silnika - plikiem, nie w `environment:` proxy - zeby nie wyciekal
  # przez `docker inspect n8niframe-proxy`.
  caddy_token_dagu:
    content: |
      header_up Authorization "Bearer ${DAGU_PROXY_TOKEN:?ustaw DAGU_PROXY_TOKEN w .env}"

services:
  # --- SILNIK PROCESOW (Faza 1, za profilem "dagu" - gałąź proba-bytechef
  #     przenosi silnik na ByteChef; powrót: --profile dagu) ----------------------
  dagu:
    profiles: ["dagu"]
    # Przypiecie po digescie, nie po tagu (decyzja par. 3). Rownowazny tag: 2.16.6.
    image: ghcr.io/dagucloud/dagu@sha256:b242dc7b605aa20d6db78ba192beb82135d390025a7d9c8dfd7f08e14464c69f
    container_name: n8niframe-dagu
    restart: unless-stopped
    environment:
      # PUID/PGID=0 to tutaj NAJMNIEJSZE dzialajace uprawnienie, nie wygoda.
      # Docker na tym hoscie jest rootless: uid 0 w kontenerze = uid 1000 (paczos)
      # na hoscie, czyli wlasciciel plikow repozytorium. Obraz domyslnie schodzi do
      # PUID=1000 (`sudo -u #$PUID` w /entrypoint.sh), co w tym mapowaniu ladue na
      # obcy subuid i traci prawo zapisu do bind-mounta `dags/`. Zmierzone warianty
      # i dlaczego kazdy mniejszy nie dziala - raport T1 i docs/wycofanie.md par. 6.
      PUID: "0"
      PGID: "0"
      DAGU_HOST: 0.0.0.0
      DAGU_PORT: "8080"
      # Natywne hostowanie pod podsciezka. Dagu rejestruje POD NIM wszystko
      # (/dagu/assets, /dagu/api/v1, /dagu/mcp), wiec Caddy prefiksu NIE obcina.
      DAGU_BASE_PATH: /dagu
      DAGU_PUBLIC_URL: http://127.0.0.1:8080/dagu
      # Bez tego Dagu zasiewa wlasne przyklady do dags/, a dags/ to repozytorium.
      DAGU_SKIP_EXAMPLES: "true"
      DAGU_TZ: Europe/Warsaw
    configs:
      - source: dagu_config
        target: /var/lib/dagu/config.yaml
        mode: 0400
      - source: dagu_zasiew_bazowego
        target: /etc/custom-init.d/10-plik-bazowy.sh
        mode: 0755
    volumes:
      # JEDEN wolumen na cale /var/lib/dagu. Montowanie samych dags/ i data/ gubi
      # logi przy `recreate` - zmierzone w audycie [D19]: 25 katalogow z logami -> 2,
      # a log starego przebiegu zwracal 404.
      - dagu_data:/var/lib/dagu
      # Definicje procesow z repozytorium. Zapisywalne: `dagu_change upsert_dag`
      # nadpisuje caly plik, a historia pracy agenta ma mieszkac w Gicie (par. 11).
      - ./dags:/var/lib/dagu/dags
      # Zatwierdzone kontrakty danych (wlasnosc T2). Silnik ma je tylko CZYTAC.
      - ./kontrakty:/var/lib/dagu/kontrakty:ro
      # Plik bazowy silnika. Zapisywalny dla silnika (admin edytuje go REST-em),
      # read-only dla chat-backend - patrz `base_config` wyzej.
      - dagu_bazowy:/var/lib/dagu/bazowy
    expose:
      - "8080"                       # tylko w sieci compose; na host wychodzi przez proxy
    networks:
      - wewnetrzna                   # bez wyjscia na swiat i bez sasiadow spoza tej sieci
    # Socket Dockera NIE jest montowany (decyzja par. 5.2, "Srodki niezalezne").

  # --- APLIKACJA ---------------------------------------------------------------
  frontend:
    build: ./frontend
    container_name: n8niframe-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - wewnetrzna

  chat-backend:
    build: ./chat-backend
    container_name: n8niframe-chat
    restart: unless-stopped
    environment:
      # Adres MCP silnika. CELOWO bezposrednio do `dagu`, z pominieciem proxy:
      # proxy w wariancie B2 PODMIENIA naglowek Authorization na token admina, wiec
      # ruch przez proxy podniosl by klucz agenta (developer/mcp) do admina i zniosl
      # zawezenie z audytu P5. Obie uslugi sa w sieci `wewnetrzna`.
      DAGU_MCP_URL: http://dagu:8080/dagu/mcp
      # Klucz agenta: rola `developer`, allowedSurfaces ["mcp"] (par. 5.2, audyt P5).
      # Nie opuszcza backendu - chat-backend/KONTRAKT.md par. 4.5.
      DAGU_MCP_TOKEN: ${DAGU_AGENT_TOKEN:?ustaw DAGU_AGENT_TOKEN w .env}
      KONTRAKTY_DIR: /app/kontrakty
      ZEZWOLENIA_PLIK: /app/dane/zezwolenia.json
      # Plik bazowy silnika, TYLKO DO ODCZYTU. Warstwa polityki czyta z niego akcje
      # wlasne (chat-backend/KONTRAKT.md par. 4.7); bez tego jedna droga obejscia
      # zostaje otwarta.
      DAGU_BASE_YAML: /silnik/base.yaml
      POLITYKA_MCP_PORT: "8788"
      # Brama sesji /api/* (R-A). Kontrakt: chat-backend/sesja/KONTRAKT.md.
      SESJA_HASLO: ${SESJA_HASLO:?ustaw SESJA_HASLO w .env}
      SESJA_ORIGIN: ${SESJA_ORIGIN:-http://127.0.0.1:8080}
      SESJA_TTL_H: ${SESJA_TTL_H:-8}
    volumes:
      # NAPRAWA BLEDU ZASTANEGO (decyzja par. 9 pkt 1): poprzednio montowany byl
      # POJEDYNCZY PLIK ${HOME}/.claude/.credentials.json, co przypina i-wezel -
      # atomowa podmiana na hoscie (zapis tymczasowy + rename) nie byla widoczna
      # w kontenerze i czat konczyl sie "OAuth session expired".
      # Teraz montowany jest KATALOG, ale nie ${HOME}/.claude (patrz usluga
      # `poswiadczenia` nizej), tylko wolumen z jednym plikiem. Read-only.
      - poswiadczenia:/seed:ro
      # Kontrakty T2 read-only; obraz ma wlasna kopie jako wartosc domyslna.
      - ./kontrakty:/app/kontrakty:ro
      # Plik bazowy silnika - read-only i BEZ reszty wolumenu silnika.
      - dagu_bazowy:/silnik:ro
      # Dziennik zezwolen warstwy polityki. OSOBNY wolumen, swiadomie NIE wspoldzielony
      # z wolumenem silnika: krok DAG-a biegnie jako root (par. 5.2 R-C) i gdyby mial
      # tam zapis, podmienilby wlasne zezwolenie. Wolumen, a nie katalog w kontenerze,
      # bo zezwolenia maja PRZEZYC `recreate` backendu (test T2).
      - zezwolenia:/app/dane
    expose:
      - "8787"
    networks:
      - wewnetrzna                   # proxy i silnik
      - wyjsciowa                    # API modelu - jedyna usluga z wyjsciem na swiat
    depends_on:
      - bytechef
      - poswiadczenia

  # --- POSWIADCZENIA: swiadomie glupi posrednik --------------------------------
  #
  # Po co on jest (nie usuwac bez przeczytania):
  #
  # Naprawa par. 9 pkt 1 wymaga montowania KATALOGU, bo montaz pojedynczego pliku
  # przypina i-wezel. Ale jedyny katalog, w ktorym ten plik lezy, to ${HOME}/.claude,
  # a tam obok poswiadczen siedzi: history.jsonl (historia promptow), projects/
  # (pelne transkrypty rozmow), sessions/, shell-snapshots/, settings.json,
  # telemetry/, uploads/. Wpuszczenie tego do kontenera, w ktorym biega model,
  # byloby ZWIEKSZENIEM ekspozycji przy okazji naprawy czegos innego.
  #
  # Dlatego ekspozycja zostaje tutaj: ten kontener widzi ${HOME}/.claude (read-only),
  # ale nie ma sieci (network_mode: none), nie ma modelu i nie robi nic poza
  # przepisaniem JEDNEGO pliku do wolumenu `poswiadczenia`. chat-backend montuje ten
  # wolumen read-only i widzi dokladnie jeden plik.
  #
  # Kopiowanie jest w petli (nie raz przy starcie), bo host odswieza token w tle co
  # kilka godzin - jednorazowa kopia odtworzylaby dokladnie naprawiany blad.
  # Kopiowanie jest atomowe (zapis obok + mv), zeby chat-backend nigdy nie zobaczyl
  # polowy pliku.
  poswiadczenia:
    image: alpine:3.22
    container_name: n8niframe-poswiadczenia
    restart: unless-stopped
    network_mode: none
    read_only: true
    volumes:
      - ${HOME}/.claude:/host-claude:ro
      - poswiadczenia:/poswiadczenia
    command:
      - sh
      - -c
      - |
        set -eu
        # Jeden mechanizm, dwa pliki: poswiadczenia (obowiazkowy) i settings.json
        # (opcjonalny - konfiguracja modelu CLI na hoscie, np. przelaczenie na GLM
        # przez ANTHROPIC_BASE_URL; backend czyta z niego wylacznie blok "env",
        # patrz syncCliSettings w chat-backend/credentials.mjs).
        sledz() {
          ZRODLO="$$1"; CEL="$$2"; SUMA="$$3"; OPIS="$$4"; WYMAGANY="$$5"
          if [ -f "$$ZRODLO" ]; then
            NOWA=$$(sha256sum "$$ZRODLO" | cut -d' ' -f1)
            STARA=$$(cat "$$SUMA" 2>/dev/null || echo brak)
            if [ "$$NOWA" != "$$STARA" ]; then
              # Plik tymczasowy w TYM SAMYM katalogu, potem mv - podmiana atomowa.
              cp "$$ZRODLO" "$$CEL.tmp"
              chmod 600 "$$CEL.tmp"
              mv "$$CEL.tmp" "$$CEL"
              printf '%s' "$$NOWA" > "$$SUMA"
              echo "$$OPIS odswiezone $$(date -Is) suma=$${NOWA%$${NOWA#????????}}..."
            fi
          else
            rm -f "$$CEL" "$$SUMA"
            if [ "$$WYMAGANY" = tak ]; then
              echo "UWAGA: brak $$ZRODLO na hoscie - czat nie bedzie mogl sie uwierzytelnic"
            fi
          fi
        }
        echo "posrednik poswiadczen: obserwuje /host-claude co 5 s"
        while :; do
          sledz /host-claude/.credentials.json /poswiadczenia/.credentials.json \
                /poswiadczenia/.suma "poswiadczenia" tak
          sledz /host-claude/settings.json /poswiadczenia/settings.json \
                /poswiadczenia/.suma-settings "ustawienia cli" nie
          sleep 5
        done

  # --- PROXY -------------------------------------------------------------------
  proxy:
    image: caddy:2.10-alpine
    container_name: n8niframe-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"          # tylko lokalnie, bez wystawiania na swiat
      - "127.0.0.1:8081:81"          # ByteChef (proba-bytechef): ten sam Caddy,
                                     # osobny port wejsciowy, bo ByteChef nie
                                     # wspiera podsciezki (assets na twardo /)
    configs:
      - source: caddy_token_dagu
        target: /etc/caddy/dagu-token.conf
        mode: 0400
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - wewnetrzna
      # `wyjsciowa` jest tu z POWODU TECHNICZNEGO, nie z potrzeby wyjscia na swiat.
      # Zmierzone na tym hoscie (Docker 29.8.0, rootless): kontener podpiety
      # WYLACZNIE do sieci `internal: true` nie dostaje mapowania portu - Docker
      # cicho je gubi (`.NetworkSettings.Ports` = {"80/tcp":null}) i 127.0.0.1:8080
      # nie odpowiada. Ten sam kontener dopiety dodatkowo do zwyklej sieci publikuje
      # port normalnie. Decyzja par. 5.2 pokazuje `proxy: [wewnetrzna]`, ale tamten
      # fragment jest ilustracja podzialu, a wymaganie brzmi: SILNIK bez wyjscia
      # i bez sasiadow. `dagu` zostaje wylacznie w `wewnetrzna` i to sie nie zmienia.
      - wyjsciowa
      - wycofanie                    # trasa /n8n/* po wlaczeniu profilu `n8n`
    depends_on:
      - bytechef
      - frontend
      - chat-backend

  # --- DROGA WYCOFANIA: stary silnik za profilem -------------------------------
  #
  # `docker compose up -d` NIE uruchamia tej uslugi. Wlacza sie ja jawnie:
  #   docker compose --profile n8n up -d n8n
  # Wolumen n8n_data (n8niframe_n8n_data) z 15 procesami i 12 wykonaniami jest
  # NIETYKALNY. Zakazane na kazdym etapie: `docker compose down -v`,
  # `docker volume rm`, `docker system prune`.
  n8n:
    profiles: ["n8n"]
    image: n8nio/n8n:2.38.7          # aktualny tag "stable" na Docker Hub (2026-09-14)
    container_name: n8niframe-n8n
    restart: unless-stopped
    environment:
      # --- adresacja za reverse proxy ---
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_PATH: /n8n/                # n8n serwuje sie pod podsciezka
      N8N_EDITOR_BASE_URL: http://localhost:8080/n8n/
      WEBHOOK_URL: http://localhost:8080/n8n/
      N8N_PROXY_HOPS: "1"            # jeden reverse proxy (Caddy) przed n8n
      # --- osadzanie w iframe: tylko ta sama aplikacja (ten sam origin) ---
      N8N_CONTENT_SECURITY_POLICY: '{"frame-ancestors":["''self''"]}'
      # --- ciasteczka: HTTP lokalnie, ten sam origin co aplikacja ---
      N8N_SECURE_COOKIE: "false"
      N8N_SAMESITE_COOKIE: lax
      # --- konto wlasciciela zakladane automatycznie przy starcie ---
      # Od n8n 2.17.0. MANAGED_BY_ENV=true sprawia, ze n8n stosuje te wartosci
      # przy kazdym starcie i blokuje edycje tego uzytkownika w UI.
      # Hash bcrypt hasla "Admin123" ($$ to ucieczka przed interpolacja Compose).
      # To lokalne haslo demonstracyjne na 127.0.0.1, odnotowane w decyzji par. 11.
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
      N8N_INSTANCE_OWNER_EMAIL: admin@admin.com
      N8N_INSTANCE_OWNER_FIRST_NAME: Admin
      N8N_INSTANCE_OWNER_LAST_NAME: Local
      N8N_INSTANCE_OWNER_PASSWORD_HASH: "$$2b$$10$$JcvrSMfg19oTwS8QCkyS9eAbcJB4FzWuDRGOTTBP7FcVuVCtJBys."
      # --- dostep MCP na poziomie instancji (od n8n 2.20.0) ---
      N8N_MCP_MANAGED_BY_ENV: "true"
      N8N_MCP_ACCESS_ENABLED: "true"
      # --- reszta ---
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      GENERIC_TIMEZONE: Europe/Warsaw
      TZ: Europe/Warsaw
    volumes:
      - n8n_data:/home/node/.n8n     # trwale dane: baza SQLite + klucz szyfrowania
    expose:
      - "5678"                       # tylko w sieci compose, bez publikacji na host
    networks:
      - wycofanie                    # osobna siec: krok DAG-a nie widzi tej nazwy

  # --- SILNIK PROCESOW (proba-bytechef) ---------------------------------------
  # ByteChef: jeden kontener (server + worker + UI, Spring Boot/Tomcat) + Postgres.
  # Obraz upstream; przypiecie po tagu - digest dodac po pierwszym odbiorze.
  # Nasza zmiana wzgledem przykladu upstream: BEZ publikacji portu na host
  # (wchodzi przez Caddy na 127.0.0.1:8081), siec wewnetrzna, klucz remember-me
  # z .env a nie hardcoded (upstream trzyma w compose przyklad na stale).
  bytechef:
    image: docker.bytechef.io/bytechef/bytechef:latest
    container_name: n8niframe-bytechef
    restart: unless-stopped
    depends_on:
      - bytechef-postgres
    environment:
      BYTECHEF_DATASOURCE_URL: jdbc:postgresql://bytechef-postgres:5432/bytechef
      BYTECHEF_DATASOURCE_USERNAME: bytechef
      BYTECHEF_DATASOURCE_PASSWORD: ${BYTECHEF_DB_HASLO:?ustaw BYTECHEF_DB_HASLO w .env}
      BYTECHEF_SECURITY_REMEMBER_ME_KEY: ${BYTECHEF_REMEMBER_ME_KLUCZ:?ustaw BYTECHEF_REMEMBER_ME_KLUCZ w .env}
    volumes:
      - bytechef_home:/root/.bytechef   # wygenerowane klucze szyfrowania - musza
                                        # przetrwac recreate, inaczej dane w DB
                                        # staja sie nieodczytywalne
    expose:
      - "8080"
    networks:
      - wewnetrzna
      # Wyjscie na swiat: zadania workflow (httpRequest itp.) musza dosiegac
      # publicznych API - ta sama racja, dla ktorej proxy siedzi w "wyjsciowa".
      - wyjsciowa

  bytechef-postgres:
    image: postgres:16-alpine
    container_name: n8niframe-bytechef-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bytechef
      POSTGRES_PASSWORD: ${BYTECHEF_DB_HASLO:?ustaw BYTECHEF_DB_HASLO w .env}
      POSTGRES_DB: bytechef
    volumes:
      - bytechef_db:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - wewnetrzna

volumes:
  n8n_data:          # NIETYKALNY - pelna nazwa n8niframe_n8n_data
  dagu_data:         # cale /var/lib/dagu: definicje, historia, logi, klucze API
  dagu_bazowy:       # sam base.yaml: zapis dla silnika, odczyt dla warstwy polityki
